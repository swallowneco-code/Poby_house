# 서버에 올릴 때 쓰는 설정. SPRING_PROFILES_ACTIVE=staging 으로 켠다.
# 기본 application.yml 은 내 PC 기준이라 그대로 나가면 안 되는 것이 몇 개 있다.

spring:
  thymeleaf:
    # 개발용으로 꺼 뒀던 것. 서버에서는 매 요청 템플릿을 다시 읽을 이유가 없다
    cache: true

logging:
  level:
    root: info
    io.poby_house: info
    # ★ 여기가 핵심이다.
    # log4jdbc 는 바인딩 값을 SQL 에 그대로 박아서 찍는다.
    # 켜 두면 "김민준", "대치초" 같은 값이 서버 로그로 흘러나간다.
    # schema.sql 이 실명은 시스템 내부 화면에서만 쓴다고 못박아 둔 것과 어긋나므로 끈다.
    # 쿼리를 봐야 할 일이 생기면 그때만 잠깐 info 로 올린다.
    jdbc: off
    jdbc.sqlonly: off
