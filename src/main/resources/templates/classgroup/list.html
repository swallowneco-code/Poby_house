<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page(~{::title}, ~{::main}, ~{})}">
<head>
    <title>반 목록</title>
</head>
<body>
<main>

    <p class="empty" th:if="${#lists.isEmpty(groups)}">
        아직 만든 반이 없습니다.<br>
        오른쪽 위 <b>+ 반 만들기</b>로 시작하세요.
    </p>

    <ul class="students">
        <li th:each="g : ${groups}">
            <a th:href="@{/classes/{id}(id=${g.id})}">
                <span>
                    <span class="s-name" th:text="${g.name}">화목 A반</span>
                    <span class="badge LEFT" th:unless="${g.active}">종료</span>
                    <br>
                    <span class="s-sub" th:text="${g.scheduleText}">화목 15:00~16:30</span>
                    <span class="s-sub" th:if="${g.level}" th:text="' · ' + ${g.level}"> · 분수심화</span>
                </span>
                <span class="s-right">
                    <span class="badge ACTIVE" th:text="${counts.get(g.id)} + '명'">0명</span>
                </span>
            </a>
        </li>
    </ul>

    <p class="soon" th:if="${not #lists.isEmpty(groups)}">
        총 <b th:text="${#lists.size(groups)}">0</b>개 반
        <span th:if="${unassigned > 0}">
            · 아직 반이 없는 학생 <b th:text="${unassigned}">0</b>명
        </span>
    </p>

</main>
</body>
</html>
