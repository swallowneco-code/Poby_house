<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${group.name} + ' - 반 정보'">반 정보</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header class="top">
    <div class="wrap">
        <a class="brand" th:href="@{/classes}">← 반 목록</a>
        <a class="btn" th:href="@{/classes/{id}/edit(id=${group.id})}">수정</a>
    </div>
</header>

<div class="wrap">

    <div class="flash" th:if="${message}" th:text="${message}"></div>
    <div class="flash err" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <h1>
        <span th:text="${group.name}">화목 A반</span>
        <span class="badge LEFT" th:unless="${group.active}">종료</span>
    </h1>

    <div class="card">
        <dl class="detail">
            <div><dt>진도 레벨</dt><dd th:text="${group.level} ?: '—'">분수 심화</dd></div>
            <div><dt>수업 시간</dt><dd th:text="${group.scheduleText}">화목 15:00~16:30</dd></div>
            <div><dt>담당</dt><dd th:text="${group.teacher != null} ? ${group.teacher.name} : '—'">포비</dd></div>
        </dl>
    </div>

    <h2 class="sec">소속 학생 <span class="cnt" th:text="${#lists.size(enrollments)}">0</span></h2>

    <p class="empty" th:if="${#lists.isEmpty(enrollments)}">
        아직 이 반에 배정된 학생이 없습니다.
    </p>

    <ul class="students">
        <li th:each="e : ${enrollments}">
            <div class="row">
                <a class="rowmain" th:href="@{/students/{id}(id=${e.student.id})}">
                    <span class="s-name" th:text="${e.student.name}">김민준</span>
                    <span class="s-sub" th:text="${e.student.grade} ?: ''">초6</span>
                    <br>
                    <span class="code" th:text="${e.student.code} + ' · ' + ${e.startedOn} + ' 배정'">S2026001</span>
                </a>
                <form method="post" th:action="@{/classes/{id}/students/{eid}/release(id=${group.id},eid=${e.id})}">
                    <button type="submit" class="btn small quiet">빼기</button>
                </form>
            </div>
        </li>
    </ul>

    <h2 class="sec">학생 추가 <span class="cnt" th:text="${#lists.size(assignable)}">0</span></h2>

    <div class="card" th:if="${not #lists.isEmpty(assignable)}">
        <div class="searchrow">
            <input type="search" id="stuSearch" placeholder="이름으로 검색 후 엔터" autocomplete="off" autofocus>
            <button type="button" class="btn primary" id="quickAdd" disabled>추가</button>
        </div>
        <p class="pickhint" id="pickHint"></p>
        <p class="hint">
            <b>어느 반에도 속하지 않은</b> 재원생만 나옵니다.
            반을 옮기려면 원래 반에서 <b>빼기</b>를 먼저 하세요.
        </p>

        <ul class="pick" id="pickList">
            <li th:each="s : ${assignable}" th:attr="data-name=${s.name}">
                <form method="post" th:action="@{/classes/{id}/students(id=${group.id})}">
                    <input type="hidden" name="studentId" th:value="${s.id}">
                    <span class="pick-main">
                        <span class="s-name" th:text="${s.name}">김민준</span>
                        <span class="s-sub" th:text="${s.grade} ?: ''">초6</span>
                        <span class="code" th:text="${s.code}">S2026001</span>
                    </span>
                    <button class="btn small primary" type="submit">추가</button>
                </form>
            </li>
        </ul>
        <p class="nomatch" id="noMatch" style="display:none">검색 결과가 없습니다.</p>
    </div>

    <p class="soon" th:if="${#lists.isEmpty(assignable)}">
        추가할 학생이 없습니다. 재원생 전원이 이미 어느 반엔가 소속돼 있거나, 등록된 학생이 없습니다.
    </p>

    <div class="card">
        <p class="soon"><b>다음에 붙일 것</b><br>수업 회차 · 출결 · 진도기록</p>
    </div>

</div>

<script>
    // 이름으로 즉시 걸러낸다. 서버에 다시 묻지 않는다.
    // 후보가 딱 한 명으로 좁혀졌을 때만 엔터로 추가한다. 여러 명일 때 넘겨짚지 않는다.
    (function () {
        var box = document.getElementById('stuSearch');
        if (!box) return;

        var items = Array.prototype.slice.call(document.querySelectorAll('#pickList li'));
        var noMatch = document.getElementById('noMatch');
        var hint = document.getElementById('pickHint');
        var addBtn = document.getElementById('quickAdd');

        function visible() {
            return items.filter(function (li) { return li.style.display !== 'none'; });
        }

        function setHint(text, cls) {
            hint.textContent = text;
            hint.className = 'pickhint' + (cls ? ' ' + cls : '');
        }

        function refresh() {
            var q = box.value.trim().toLowerCase();
            var shown = 0;
            items.forEach(function (li) {
                var hit = !q || (li.getAttribute('data-name') || '').toLowerCase().indexOf(q) !== -1;
                li.style.display = hit ? '' : 'none';
                if (hit) shown++;
            });
            noMatch.style.display = shown ? 'none' : '';

            var vis = visible();
            if (!q) {
                setHint('', null);
                addBtn.disabled = true;
            } else if (vis.length === 1) {
                setHint(vis[0].getAttribute('data-name') + ' 학생을 추가합니다. 엔터를 누르세요.', 'ready');
                addBtn.disabled = false;
            } else if (vis.length === 0) {
                setHint('검색 결과가 없습니다.', 'none');
                addBtn.disabled = true;
            } else {
                setHint(vis.length + '명이 검색됩니다. 이름을 더 입력하세요.', 'warn');
                addBtn.disabled = true;
            }
        }

        function addOne() {
            var vis = visible();
            if (vis.length !== 1) return;
            addBtn.disabled = true;
            vis[0].querySelector('form').submit();
        }

        box.addEventListener('input', refresh);
        box.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addOne();
            }
        });
        addBtn.addEventListener('click', addOne);

        refresh();
    })();
</script>

</body>
</html>
