<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page(~{::title}, ~{::main}, ~{})}">
<head>
    <title th:text="${editing} ? '반 수정' : '반 만들기'">반 만들기</title>
</head>
<body>
<main>

    <h1 th:text="${editing} ? '반 수정' : '반 만들기'">반 만들기</h1>

    <form method="post"
          th:action="${editing} ? @{/classes/{id}(id=${group.id})} : @{/classes}"
          th:object="${form}">

        <div class="card">

            <label for="name">반 이름 <span class="req">*</span></label>
            <input type="text" id="name" th:field="*{name}" placeholder="화목 A반" required autofocus>
            <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

            <label for="level">진도 레벨</label>
            <input type="text" id="level" th:field="*{level}" placeholder="분수 심화">
            <p class="hint">학년이 아니라 <b>진도</b> 기준입니다. 한 반에 초5·초6·중1이 섞여도 정상입니다.</p>

            <label for="dayOfWeek">요일</label>
            <input type="text" id="dayOfWeek" th:field="*{dayOfWeek}" placeholder="화목">

            <label for="startTime">시작 시각</label>
            <input type="time" id="startTime" th:field="*{startTime}">

            <label for="endTime">종료 시각</label>
            <input type="time" id="endTime" th:field="*{endTime}">

            <label class="check">
                <input type="checkbox" th:field="*{active}">
                운영 중인 반
            </label>
            <p class="hint">체크를 풀면 목록에서 <b>종료</b>로 표시됩니다. 지난 기록은 그대로 남습니다.</p>

        </div>

        <div class="actions">
            <a class="btn wide" th:href="${editing} ? @{/classes/{id}(id=${group.id})} : @{/classes}">취소</a>
            <button class="btn primary wide" type="submit" th:text="${editing} ? '저장' : '만들기'">만들기</button>
        </div>

    </form>

</main>
</body>
</html>
