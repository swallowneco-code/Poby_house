<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비밀번호 변경</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header class="top">
    <div class="wrap">
        <a class="brand" th:href="@{/students}">← 학생 목록</a>
        <span class="who" th:if="${currentUserName}" th:text="${currentUserName}">포비</span>
    </div>
</header>

<div class="wrap">

    <h1>비밀번호 변경</h1>

    <form method="post" th:action="@{/account/password}" th:object="${form}">
        <div class="card">

            <label for="currentPassword">현재 비밀번호</label>
            <input type="password" id="currentPassword" th:field="*{currentPassword}" autocomplete="current-password" autofocus>
            <p class="error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></p>

            <label for="newPassword">새 비밀번호</label>
            <input type="password" id="newPassword" th:field="*{newPassword}" autocomplete="new-password">
            <p class="hint">8자 이상</p>
            <p class="error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>

            <label for="newPasswordConfirm">새 비밀번호 확인</label>
            <input type="password" id="newPasswordConfirm" th:field="*{newPasswordConfirm}" autocomplete="new-password">
            <p class="error" th:if="${#fields.hasErrors('newPasswordConfirm')}" th:errors="*{newPasswordConfirm}"></p>

        </div>

        <div class="actions">
            <a class="btn wide" th:href="@{/students}">취소</a>
            <button class="btn primary wide" type="submit">변경</button>
        </div>
    </form>

</div>
</body>
</html>
