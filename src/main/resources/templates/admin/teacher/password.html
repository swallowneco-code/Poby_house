<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page(~{::title}, ~{::main}, ~{})}">
<head>
    <title>비밀번호 초기화</title>
</head>
<body>
<main>

    <h1>비밀번호 초기화</h1>

    <div class="card">
        <dl class="detail">
            <div><dt>이름</dt><dd th:text="${teacher.name}">김강사</dd></div>
            <div><dt>아이디</dt><dd class="code" th:text="${teacher.loginId}">kim</dd></div>
        </dl>
    </div>

    <form method="post" th:action="@{/admin/teachers/{id}/password(id=${teacher.id})}" th:object="${form}">
        <div class="card">

            <label for="newPassword">새 비밀번호 <span class="req">*</span></label>
            <input type="password" id="newPassword" th:field="*{newPassword}"
                   autocomplete="new-password" required autofocus>
            <p class="hint">8자 이상. 임시로 정해 주고, 본인이 로그인한 뒤 직접 바꾸게 하세요.</p>
            <p class="error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>

            <label for="newPasswordConfirm">새 비밀번호 확인 <span class="req">*</span></label>
            <input type="password" id="newPasswordConfirm" th:field="*{newPasswordConfirm}"
                   autocomplete="new-password" required>
            <p class="error" th:if="${#fields.hasErrors('newPasswordConfirm')}" th:errors="*{newPasswordConfirm}"></p>

        </div>

        <div class="actions">
            <a class="btn wide" th:href="@{/admin/teachers}">취소</a>
            <button class="btn primary wide" type="submit">초기화</button>
        </div>
    </form>

</main>
</body>
</html>
