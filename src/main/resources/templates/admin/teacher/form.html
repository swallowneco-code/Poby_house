<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page(~{::title}, ~{::main}, ~{})}">
<head>
    <title th:text="${editing} ? '계정 수정' : '계정 추가'">계정 추가</title>
</head>
<body>
<main>

    <h1 th:text="${editing} ? '계정 수정' : '계정 추가'">계정 추가</h1>

    <form method="post"
          th:action="${editing} ? @{/admin/teachers/{id}(id=${teacher.id})} : @{/admin/teachers}"
          th:object="${form}">

        <div class="card">

            <label for="name">이름 <span class="req">*</span></label>
            <input type="text" id="name" th:field="*{name}" placeholder="포비" required autofocus>
            <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

            <!-- 아이디는 만들 때만 정한다. 바꾸면 세션과 자동 로그인 토큰이 어긋난다 -->
            <div th:unless="${editing}">
                <label for="loginId">아이디 <span class="req">*</span></label>
                <input type="text" id="loginId" th:field="*{loginId}" placeholder="poby"
                       autocomplete="username" required>
                <p class="hint">영문·숫자·밑줄 4~20자. 나중에 바꿀 수 없습니다.</p>
                <p class="error" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}"></p>

                <label for="password">비밀번호 <span class="req">*</span></label>
                <input type="password" id="password" th:field="*{password}"
                       autocomplete="new-password" required>
                <p class="hint">8자 이상. 본인이 로그인한 뒤 직접 바꾸게 하세요.</p>
                <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

                <label for="passwordConfirm">비밀번호 확인 <span class="req">*</span></label>
                <input type="password" id="passwordConfirm" th:field="*{passwordConfirm}"
                       autocomplete="new-password" required>
                <p class="error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></p>
            </div>

            <div th:if="${editing}">
                <label>아이디</label>
                <p class="code" th:text="${teacher.loginId}">poby</p>
                <p class="hint">아이디는 바꿀 수 없습니다.</p>
            </div>

            <label for="role">권한</label>
            <select id="role" th:field="*{role}">
                <option th:each="r : ${roles}" th:value="${r.name()}" th:text="${r.label}">강사</option>
            </select>
            <p class="hint">원장은 계정 관리까지 할 수 있습니다. 강사는 학생과 반만 다룹니다.</p>
            <p class="error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></p>

            <div th:if="${editing}">
                <label class="check">
                    <input type="checkbox" th:field="*{active}">
                    사용 중인 계정
                </label>
                <p class="hint">
                    체크를 풀면 로그인할 수 없게 됩니다. 계정과 지난 기록은 그대로 남습니다.
                </p>
            </div>

        </div>

        <div class="actions">
            <a class="btn wide" th:href="@{/admin/teachers}">취소</a>
            <button class="btn primary wide" type="submit" th:text="${editing} ? '저장' : '만들기'">만들기</button>
        </div>

    </form>

</main>
</body>
</html>
