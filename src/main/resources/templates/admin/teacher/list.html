<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page(~{::title}, ~{::main}, ~{})}">
<head>
    <title>계정 관리</title>
</head>
<body>
<main>

    <h1>계정 관리</h1>

    <ul class="students">
        <li th:each="t : ${teachers}">
            <div class="row">
                <a class="rowmain" th:href="@{/admin/teachers/{id}/edit(id=${t.id})}">
                    <span class="s-name" th:text="${t.name}">포비</span>
                    <span class="s-sub" th:text="${t.role.label}">원장</span>
                    <br>
                    <span class="code" th:text="${t.loginId}">poby</span>
                </a>
                <span class="badge" th:classappend="${t.active} ? 'ACTIVE' : 'LEFT'"
                      th:text="${t.active} ? '사용' : '중지'">사용</span>
            </div>
        </li>
    </ul>

    <!-- 우상단 버튼만 두면 목록이 짧을 때 눈에 안 들어온다. 목록 바로 아래에 크게 한 번 더 둔다 -->
    <div class="actions">
        <a class="btn primary wide big" th:href="@{/admin/teachers/new}">+ 계정 추가</a>
    </div>

    <p class="hint" th:if="${#lists.size(teachers) == 1}">
        아직 계정이 하나뿐입니다. 강사가 늘면 여기서 계정을 만들어 주세요.
    </p>

    <p class="soon">
        계정은 지우지 않고 <b>중지</b>합니다.
        지난 기록에 누가 썼는지가 남아 있어야 퇴원생 리포트의 근거가 유지됩니다.
    </p>

</main>
</body>
</html>
