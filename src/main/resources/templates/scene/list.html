<!DOCTYPE html>
<!--
  장면 목록 + 등록. 한 화면이다.

  3분 기록인데 "추가" 를 눌러 화면을 옮기게 만들면 수업 끝나고 폰으로는 아무도 안 적는다.
  그래서 등록 폼이 목록 위에 항상 열려 있다.
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page(~{::title}, ~{::main}, ~{})}">
<head>
    <title th:text="${student.name} + ' - 장면'">장면</title>
</head>
<body>
<main>

    <h1>
        <span th:text="${student.name}">김민준</span> 장면
        <span class="code" th:text="${student.code}">S2026001</span>
    </h1>

    <!-- 이번 분기에 적었는가. 분기 1개면 충분한 기록이라 "없다" 를 먼저 알려 준다 -->
    <p class="q-note miss" th:if="${quarterCount == 0}">
        <b th:text="'이번 분기(' + ${quarterLabel} + ')에 적은 장면이 아직 없습니다.'">이번 분기에 없습니다.</b>
        <br>한 개면 충분합니다. 지금 떠오르는 한 장면을 적어 두세요.
    </p>
    <p class="q-note ok" th:unless="${quarterCount == 0}"
       th:text="'이번 분기(' + ${quarterLabel} + ')에 ' + ${quarterCount} + '개 적었습니다. 분기당 1개면 충분합니다.'">
        이번 분기에 1개 적었습니다.
    </p>

    <form method="post" th:action="@{/students/{id}/scenes(id=${student.id})}" th:object="${form}">
        <div class="card">

            <label for="occurredOn">있었던 날 <span class="req">*</span></label>
            <input type="date" id="occurredOn" th:field="*{occurredOn}" required>
            <p class="error" th:if="${#fields.hasErrors('occurredOn')}" th:errors="*{occurredOn}"></p>

            <label for="situation">어떤 상황</label>
            <input type="text" id="situation" th:field="*{situation}"
                   placeholder="쉬는 시간에 / 채점 직후 / 오답을 같이 보다가">
            <p class="error" th:if="${#fields.hasErrors('situation')}" th:errors="*{situation}"></p>

            <label for="content">무엇을 했고 무슨 말을 했나 <span class="req">*</span></label>
            <textarea id="content" th:field="*{content}" autofocus required
                      placeholder="5분 일찍 와서 지난 오답 3번을 다시 풀었다. '이건 조건을 잘못 봤네요' 라고 스스로 말했다."></textarea>
            <p class="error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></p>

            <p class="q-rule">
                <b>성격이 아니라 행동을 씁니다.</b><br>
                <span class="q-bad">성실하다</span> 대신
                <span class="q-good">5분 일찍 와서 지난 오답을 다시 풀었다</span>.<br>
                본 것과 들은 말만 적으면 몇 년 뒤에도 근거가 남습니다.
            </p>

        </div>

        <!-- 버튼은 카드 밖 .actions 안에 둔다. .btn.wide 의 flex:1 은 부모가 flex 일 때만 먹는다 -->
        <div class="actions">
            <button class="btn primary wide big" type="submit">이 장면 기록</button>
        </div>
    </form>

    <th:block th:replace="~{layout/record :: sectionHead('지난 장면', ${#lists.size(scenes)}, null, null)}"></th:block>

    <th:block th:if="${#lists.isEmpty(scenes)}">
        <th:block th:replace="~{layout/record :: emptyRecord(
            '아직 장면 기록이 없습니다.',
            '수업 중 한 장면을 적어 두면 리포트 4-1 편지의 재료가 됩니다. 시험지에는 남지 않는 기록입니다.')}"></th:block>
    </th:block>

    <!--
      recordCard 를 쓰지 않고 직접 그린다. 카드마다 수정 링크와 작성자 줄이 필요한데
      그 조각은 문자열 세 개만 받는다. 클래스 이름은 그대로라 모양은 같다.
    -->
    <article class="rec-card" th:each="sc : ${scenes}">
        <p class="rec-title rec-titlerow">
            <span th:text="${sc.occurredOn}">2026-08-18</span>
            <a class="btn small quiet rec-editlink"
               th:href="@{/scenes/{sid}/edit(sid=${sc.id})}">수정</a>
        </p>
        <p class="rec-meta" th:if="${sc.situation}" th:text="${sc.situation}">쉬는 시간에</p>
        <p class="rec-body" th:text="${sc.content}">남아서 3번을 다시 풀었다.</p>
        <th:block th:replace="~{layout/record :: authorLine(${sc.createdBy}, ${sc.createdAt})}"></th:block>
    </article>

    <div class="actions">
        <a class="btn wide" th:href="@{/students/{id}(id=${student.id})}">학생 정보</a>
        <a class="btn wide" th:href="@{/students/{id}/interventions(id=${student.id})}">개입 로그</a>
    </div>

</main>
</body>
</html>
