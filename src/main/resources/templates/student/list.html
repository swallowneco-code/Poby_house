<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page(~{::title}, ~{::main}, ~{})}">
<head>
    <title>학생 목록</title>
</head>
<body>
<main>

    <div class="toolbar">
        <!-- 검색해도 고른 상태가 풀리지 않게 함께 보낸다. page 는 일부러 안 보낸다(검색하면 1쪽부터) -->
        <form method="get" th:action="@{/students}">
            <input type="hidden" name="status" th:if="${status != null}" th:value="${status.name()}">
            <!--
              autocomplete="off" 를 반드시 둔다.
              검색이 GET 이라 실명이 주소에 실리는데, 폼 기록까지 남으면 공용 PC 나
              남이 잡은 강사 폰의 주소창·입력칸 자동완성에 찾아본 학생 이름이 그대로 뜬다.
              식별번호(S2026001)로도 검색되므로 실명을 안 넣고 찾는 길이 이미 있다.
            -->
            <input type="search" name="keyword" placeholder="식별번호(S2026001)·이름·학교로 검색"
                   autocomplete="off" th:value="${keyword}">
            <button class="btn" type="submit">검색</button>
        </form>
    </div>
    <p class="hint">
        <b>식별번호</b>로도 찾을 수 있습니다. 검색어는 주소에 남으니, 공용 PC 에서는 식별번호를 쓰세요.
    </p>

    <div class="toolbar">
        <!-- 상태를 바꿔도 검색어는 유지한다 -->
        <a class="chip" th:classappend="${status == null} ? 'on'"
           th:href="@{/students(keyword=${keyword})}">전체</a>
        <a class="chip" th:each="s : ${statuses}"
           th:classappend="${status != null and status.name() == s.name()} ? 'on'"
           th:href="@{/students(status=${s.name()},keyword=${keyword})}"
           th:text="${s.label}">재원</a>
    </div>

    <!--
      "한 명도 없다"와 "고른 조건에 맞는 사람이 없다"는 다른 상황이다.
      필터 때문에 비었는데 등록 버튼을 내밀면 엉뚱한 안내가 된다.
    -->
    <div th:if="${#lists.isEmpty(students)}">
        <div th:if="${status == null and keyword == null}">
            <p class="empty">아직 등록된 학생이 없습니다.</p>
            <div class="actions">
                <a class="btn primary wide big" th:href="@{/students/new}">+ 학생 등록</a>
            </div>
        </div>
        <p class="empty" th:unless="${status == null and keyword == null}">
            조건에 맞는 학생이 없습니다.
        </p>
    </div>

    <ul class="students">
        <li th:each="st : ${students}">
            <a th:href="@{/students/{id}(id=${st.id})}">
                <span>
                    <span class="s-name" th:text="${st.name}">이름</span>
                    <span class="s-sub"
                          th:text="${(st.grade ?: '') + (st.school != null ? ' · ' + st.school : '')}">초6 · 대치초</span>
                    <br>
                    <span class="code" th:text="${st.code}">S2026001</span>
                </span>
                <span class="s-right">
                    <span class="badge" th:classappend="${st.status.name()}" th:text="${st.status.label}">재원</span>
                </span>
            </a>
        </li>
    </ul>

    <!--
      총원은 화면에 올라온 목록 크기가 아니라 count 결과다.
      #lists.size 로 세면 2쪽에서 "총 3명" 같은 거짓말이 나온다.
    -->
    <p class="soon" th:if="${pageInfo.totalElements > 0}">
        총 <b th:text="${pageInfo.totalElements}">0</b>명
        <span th:if="${pageInfo.totalPages > 1}"
              th:text="'· ' + ${pageInfo.number + 1} + '/' + ${pageInfo.totalPages} + '쪽'">· 1/3쪽</span>
    </p>

    <!--
      페이지 이동은 이전 / 현재 / 다음 세 개뿐이다.
      번호를 다 늘어놓으면 폰에서 줄이 넘치고, 15쪽으로 바로 뛰는 일은 실제로 없다.
      status·keyword 를 다시 실어야 2쪽에서 필터가 풀리지 않는다.
    -->
    <nav class="pager" th:if="${pageInfo.totalPages > 1}">
        <a class="btn small" th:if="${pageInfo.hasPrevious()}"
           th:href="@{/students(status=${status?.name()},keyword=${keyword},page=${pageInfo.number - 1})}">이전</a>
        <span class="pager-now" th:text="${pageInfo.number + 1} + ' / ' + ${pageInfo.totalPages}">1 / 3</span>
        <a class="btn small" th:if="${pageInfo.hasNext()}"
           th:href="@{/students(status=${status?.name()},keyword=${keyword},page=${pageInfo.number + 1})}">다음</a>
    </nav>

</main>
</body>
</html>
