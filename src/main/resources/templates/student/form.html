<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page(~{::title}, ~{::main}, ~{})}">
<head>
    <title th:text="${editing} ? '학생 수정' : '학생 등록'">학생 등록</title>
</head>
<body>
<main>

    <h1 th:text="${editing} ? '학생 수정' : '학생 등록'">학생 등록</h1>

    <form method="post"
          th:action="${editing} ? @{/students/{id}(id=${student.id})} : @{/students}"
          th:object="${form}">

        <div class="card">

            <label for="name">이름 <span class="req">*</span></label>
            <input type="text" id="name" th:field="*{name}" placeholder="김민준" required autofocus>
            <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

            <label for="school">학교</label>
            <input type="text" id="school" th:field="*{school}" placeholder="대치초">
            <p class="error" th:if="${#fields.hasErrors('school')}" th:errors="*{school}"></p>

            <label for="grade">학년</label>
            <input type="text" id="grade" th:field="*{grade}" placeholder="초6">
            <p class="error" th:if="${#fields.hasErrors('grade')}" th:errors="*{grade}"></p>
            <p class="hint">반 편성과는 무관합니다. 반은 진도 기준으로 묶습니다.</p>

            <label for="enrolledOn">등록일 <span class="req">*</span></label>
            <input type="date" id="enrolledOn" th:field="*{enrolledOn}" required>
            <p class="error" th:if="${#fields.hasErrors('enrolledOn')}" th:errors="*{enrolledOn}"></p>

            <label for="memo">특이사항</label>
            <textarea id="memo" th:field="*{memo}" placeholder="알러지, 하원 방법 등 매번 확인할 기본 정보"></textarea>

        </div>

        <!--
          상태(재원·휴원·퇴원)는 이 폼에 없다.
          예전에는 드롭다운에서 '퇴원'을 고르면 보관 만료일까지 세워졌는데,
          되돌리기 어려운 조작이 "학교 이름 고치는 화면" 안에 숨어 있는 셈이었다.
          퇴원·휴원·복귀는 상세 화면의 전용 버튼에서 한다.
        -->
        <p class="hint" th:if="${editing}">
            퇴원·휴원 처리는 이 화면이 아니라 <b>학생 상세 화면</b>에서 합니다.
            보관 만료일과 반 배정이 함께 바뀌는 조작이라 확인 단계를 따로 두었습니다.
        </p>

        <div class="actions">
            <a class="btn wide" th:href="${editing} ? @{/students/{id}(id=${student.id})} : @{/students}">취소</a>
            <button class="btn primary wide" type="submit" th:text="${editing} ? '저장' : '등록'">등록</button>
        </div>

    </form>

</main>
</body>
</html>
