<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>최초 설정</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div class="wrap auth">

    <h1 class="auth-title">최초 설정</h1>
    <p class="hint auth-lead">
        아직 계정이 없습니다. 사용할 계정을 직접 만들어 주세요.<br>
        이 화면은 계정이 만들어지면 다시 열리지 않습니다.
    </p>

    <form method="post" th:action="@{/setup}" th:object="${form}">
        <div class="card">

            <label for="name">이름</label>
            <input type="text" id="name" th:field="*{name}" placeholder="포비" autofocus>
            <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

            <label for="loginId">아이디</label>
            <input type="text" id="loginId" th:field="*{loginId}" placeholder="poby" autocomplete="username">
            <p class="hint">영문·숫자·밑줄 4~20자</p>
            <p class="error" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}"></p>

            <label for="password">비밀번호</label>
            <input type="password" id="password" th:field="*{password}" autocomplete="new-password">
            <p class="hint">8자 이상</p>
            <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

            <label for="passwordConfirm">비밀번호 확인</label>
            <input type="password" id="passwordConfirm" th:field="*{passwordConfirm}" autocomplete="new-password">
            <p class="error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></p>

        </div>

        <div class="actions">
            <button class="btn primary wide" type="submit">계정 만들기</button>
        </div>
    </form>

</div>
</body>
</html>
