<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${classSession.classGroup.name} + ' ' + ${classSession.sessionDate}">수업 기록</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header class="top">
    <div class="wrap wide">
        <a class="brand" th:href="@{/classes/{id}(id=${classSession.classGroup.id})}">← 반으로</a>
        <span class="who" th:text="${classSession.sessionDate}">2026-08-12</span>
    </div>
</header>

<div class="wrap wide">

    <div class="flash" th:if="${message}" th:text="${message}"></div>

    <h1 th:text="${classSession.classGroup.name}">월금1반</h1>
    <p class="soon" th:text="${classSession.sessionDate} + ' · ' + ${classSession.classGroup.scheduleText}">2026-08-12</p>

    <form method="post" th:action="@{/sessions/{id}(id=${classSession.id})}" th:object="${form}" id="recordForm">

        <h2 class="sec">진도 <span class="tag">반 공통</span></h2>

        <div class="card">
            <div class="fieldrow">
                <input type="text" th:field="*{textbook}" placeholder="교재명">
                <input type="text" th:field="*{rangeText}" placeholder="p.42~55">
            </div>
            <input type="text" th:field="*{content}" placeholder="오늘 한 것">
            <input type="text" th:field="*{homework}" placeholder="오늘 과제">
            <textarea th:field="*{dailyNote}" placeholder="수업 메모 — 그날 반 전체에 있었던 일"></textarea>
        </div>

        <h2 class="sec">출결과 학생 메모 <span class="cnt" th:text="${#lists.size(form.entries)}">0</span></h2>

        <p class="empty" th:if="${#lists.isEmpty(form.entries)}">
            이 반에 소속된 학생이 없습니다.<br>
            반 화면에서 학생을 먼저 넣어 주세요.
        </p>

        <div th:if="${not #lists.isEmpty(form.entries)}">

            <p class="keyhint">
                커서는 <b>출결</b>에서 시작합니다. <b>Tab</b> 아래 학생 · <b>←→</b> 출결 고르기<br>
                <b>Tab만 연타하면 전원 출석</b>으로 찍힙니다. 찍은 버튼을 <b>한 번 더 누르면 해제</b>됩니다.<br>
                출결을 끝내면 커서가 <b>학생 메모</b> 첫 칸으로 넘어갑니다. 거기서도 Tab·Enter로 아래로 내려갑니다.
            </p>

            <div class="srow head">
                <div>학생</div>
                <div>학생 메모</div>
                <div>출결</div>
            </div>

            <div class="srow" th:each="entry, st : *{entries}">

                <input type="hidden" th:field="*{entries[__${st.index}__].studentId}">

                <div class="sname">
                    <span th:text="${entry.studentName}">김지후</span>
                    <span class="s-sub" th:text="${entry.studentGrade} ?: ''">초6</span>
                </div>

                <input type="text" class="smemo"
                       th:field="*{entries[__${st.index}__].note}"
                       placeholder="눈에 띈 것만. 없으면 비워 두세요">

                <div class="seg att">
                    <label th:each="opt : ${attendanceOptions}">
                        <input type="radio" th:field="*{entries[__${st.index}__].attendance}" th:value="${opt}">
                        <span th:text="${opt.label}">출석</span>
                    </label>
                </div>

            </div>
        </div>

        <div class="savebar" th:if="${not #lists.isEmpty(form.entries)}">
            <button class="btn primary wide" type="submit">저장</button>
        </div>

    </form>

</div>

<script>
    // Tab 은 같은 열에서만 아래로 움직인다.
    // 기본 동작대로 두면 메모와 출결을 지그재그로 오가서 출결만 훑을 수가 없다.
    (function () {
        var form = document.getElementById('recordForm');
        if (!form) return;

        var rows = Array.prototype.slice.call(form.querySelectorAll('.srow')).filter(function (r) {
            return !r.classList.contains('head');
        });
        if (!rows.length) return;

        var memos = rows.map(function (r) { return r.querySelector('input.smemo'); });
        var groups = rows.map(function (r) {
            return Array.prototype.slice.call(r.querySelectorAll('input[type=radio]'));
        });
        var saveBtn = form.querySelector('button[type=submit]');

        function checkedOf(g) {
            for (var i = 0; i < g.length; i++) { if (g[i].checked) return g[i]; }
            return null;
        }

        function focusAtt(i) {
            var g = groups[i];
            if (!g || !g.length) return;
            (checkedOf(g) || g[0]).focus();
        }

        function focusMemo(i) {
            var m = memos[i];
            if (!m) return;
            m.focus();
            m.select();
        }

        // 같은 버튼을 다시 누르면 해제된다.
        // 라디오에는 원래 없는 동작이라 라벨의 기본 활성화를 막고 직접 처리한다.
        groups.forEach(function (g) {
            g.forEach(function (radio) {
                var label = radio.parentElement;
                label.addEventListener('click', function (e) {
                    e.preventDefault();
                    var wasChecked = radio.checked;
                    g.forEach(function (r) { r.checked = false; });
                    if (!wasChecked) { radio.checked = true; }
                    radio.focus();
                });
            });
        });

        groups.forEach(function (g, i) {
            g.forEach(function (radio) {
                radio.addEventListener('keydown', function (e) {
                    if (e.key !== 'Tab') return;
                    e.preventDefault();

                    if (e.shiftKey) {
                        if (i > 0) { focusAtt(i - 1); }
                        return;
                    }
                    // 아직 아무것도 안 찍혔으면 출석으로 본다. Tab 연타 = 전원 출석
                    if (!checkedOf(g)) { g[0].checked = true; }

                    if (i + 1 < groups.length) { focusAtt(i + 1); }
                    else { focusMemo(0); }
                });
            });
        });

        memos.forEach(function (input, i) {
            if (!input) return;
            input.addEventListener('keydown', function (e) {
                if (e.key !== 'Tab' && e.key !== 'Enter') return;
                e.preventDefault();

                if (e.key === 'Tab' && e.shiftKey) {
                    if (i > 0) { focusMemo(i - 1); }
                    else { focusAtt(groups.length - 1); }
                    return;
                }
                if (i + 1 < memos.length) { focusMemo(i + 1); }
                else if (saveBtn) { saveBtn.focus(); }
            });
        });

        focusAtt(0);
    })();
</script>

</body>
</html>
