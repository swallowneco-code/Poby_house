<!DOCTYPE html>
<!--
  Boot 의 DefaultErrorViewResolver 가 잡는 최종 폴백.
  매핑되지 않은 주소(404), 권한 없음(403), 예상 밖의 오류(500)가 전부 여기로 온다.
  로그인하지 않은 상태에서도 열릴 수 있으므로 상단 메뉴는 계정 정보가 없어도 그려진다.
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page(~{::title}, ~{::main}, ~{})}">
<head>
    <title>문제가 생겼습니다</title>
</head>
<body>
<main>

    <h1 th:switch="${status}">
        <span th:case="403">권한이 없습니다</span>
        <span th:case="404">찾을 수 없습니다</span>
        <span th:case="*">문제가 생겼습니다</span>
    </h1>

    <div class="card">
        <p th:switch="${status}">
            <span th:case="403">이 화면은 원장 계정만 열 수 있습니다.</span>
            <span th:case="404">요청하신 주소가 없습니다.</span>
            <span th:case="*">잠시 뒤에 다시 시도해 주세요. 계속 같으면 기록해 두었다가 알려 주세요.</span>
        </p>
        <p class="hint">
            <span th:if="${status}" th:text="'오류 ' + ${status}">오류 500</span>
            <span th:if="${message}" th:text="' · ' + ${message}"></span>
        </p>
    </div>

    <div class="actions">
        <a class="btn wide" th:href="@{/students}">학생 목록</a>
        <a class="btn wide" th:href="@{/classes}">반 목록</a>
    </div>

</main>
</body>
</html>
