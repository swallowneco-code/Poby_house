<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div class="wrap auth">

    <h1 class="auth-title">학생 관리</h1>

    <div class="flash" th:if="${message}" th:text="${message}"></div>
    <div class="flash err" th:if="${param.error}">아이디 또는 비밀번호가 맞지 않습니다.</div>
    <div class="flash" th:if="${param.logout}">로그아웃되었습니다.</div>

    <form method="post" th:action="@{/login}">
        <div class="card">
            <label for="loginId">아이디</label>
            <input type="text" id="loginId" name="loginId" autocomplete="username" autofocus>

            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" autocomplete="current-password">
        </div>

        <div class="actions">
            <button class="btn primary wide" type="submit">로그인</button>
        </div>
    </form>

</div>
</body>
</html>
