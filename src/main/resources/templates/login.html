<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: auth(~{::title}, ~{::main})}">
<head>
    <title>로그인</title>
</head>
<body>
<main>

    <h1 class="auth-title">학생 관리</h1>

    <div class="flash" th:if="${message}" th:text="${message}"></div>
    <div class="flash err" th:if="${param.error}">아이디 또는 비밀번호가 맞지 않습니다.</div>
    <div class="flash" th:if="${param.logout}">로그아웃되었습니다.</div>

    <form method="post" th:action="@{/login}">
        <div class="card">
            <label for="loginId">아이디</label>
            <!-- 실패해도 아이디는 남긴다. 매번 다시 치게 만들 이유가 없다 -->
            <input type="text" id="loginId" name="loginId" th:value="${param.loginId}"
                   autocomplete="username" required autofocus>

            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <div class="actions">
            <button class="btn primary wide" type="submit">로그인</button>
        </div>
    </form>

</main>
</body>
</html>
