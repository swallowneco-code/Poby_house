spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:classpath:.env[.properties]
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        default_batch_fetch_size: 30
    # 템플릿 렌더링 중 지연 로딩이 필요하다. 명시해 두지 않으면 기동 시 WARN 이 뜨고,
    # 나중에 EAGER 를 LAZY 로 바꿀 때 화면이 조용히 깨진다.
    open-in-view: true
  datasource:
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    url: jdbc:log4jdbc:mysql://${DB_URL}:${DB_PORT}/POBY
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  thymeleaf:
    # 개발 중에는 템플릿을 고칠 때마다 재기동하지 않는다. 배포 프로파일에서 true 로 되돌린다.
    cache: false

server:
  servlet:
    # 지금은 전용 포트(nginx 8090)로 띄우므로 비워 둔다.
    # 나중에 /poby 같은 하위 경로로 옮기게 되면 CONTEXT_PATH 만 넣으면 된다.
    # 앱이 접두어를 직접 갖고 있어야 th:href 와 리다이렉트가 전부 맞는다.
    # nginx 가 접두어를 떼어 주는 방식은 쓰지 않는다. 서버가 만든 주소가 죄다 어긋난다.
    context-path: ${CONTEXT_PATH:}
    session:
      # 수업 끝나고 폰으로 기록하는 것이 기본 사용 환경이다. 기본 30분은 그 도중에 끊긴다.
      timeout: 8h
  error:
    # 에러 화면에 한국어 안내를 띄우려면 메시지가 넘어와야 한다.
    include-message: always

poby:
  remember-me:
    # 자동 로그인 쿠키 서명 키. 바꾸면 기존 쿠키가 전부 무효가 된다.
    # 배포할 때는 .env 의 REMEMBER_ME_KEY 로 덮어쓴다.
    key: ${REMEMBER_ME_KEY:poby-house-local-dev}

logging:
  level:
    root: info
    io.poby_house: debug
    # log4jdbc 의 sqlonly 로거는 바인딩 값을 SQL 에 인라인한다.
    # 학생 실명과 학교가 그대로 로그에 찍히므로, 커스텀 포매터가 쓰는 로거 하나만 남기고 전부 끈다.
    jdbc: off
    jdbc.sqlonly: info
